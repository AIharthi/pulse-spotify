[workspace]
members = [
    ".",
    "crates/pulse-model",
    "crates/pulse-assets",
    "crates/pulse-backend",
    "crates/pulse-ui",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
bytes = "1"
cairo-rs = { version = "0.22", features = ["png"] }
dirs = "7"
futures-util = "0.3"
gdk-pixbuf = "0.22"
gdk4 = "0.11"
gio = "0.22"
glib = "0.22"
gsk4 = "0.11"
gtk4 = { version = "0.11", features = ["v4_16"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
lofty = "0.25"
pango = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", default-features = false }

[package]
name = "pulse-spotify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pulse-model = { path = "crates/pulse-model" }
pulse-assets = { path = "crates/pulse-assets" }
pulse-backend = { path = "crates/pulse-backend" }
pulse-ui = { path = "crates/pulse-ui" }
libc.workspace = true

[build-dependencies]
# Required so librespot-discovery -> librespot-core 0.8.0 does not resolve
# vergen 9.1.0 (whose vergen-lib 9.1.0 breaks vergen-gitcl 1.0's vergen-lib 0.1.6).
vergen = "=9.0.6"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
