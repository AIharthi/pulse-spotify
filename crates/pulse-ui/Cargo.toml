[package]
name = "pulse-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pulse-model = { path = "../pulse-model" }
pulse-assets = { path = "../pulse-assets" }
# Use image-without-codecs instead of image so iced does not enable image/default (rayon + ravif).
iced = { version = "0.14.0", default-features = false, features = [
    "tiny-skia",
    "fira-sans",
    "tokio",
    "svg",
    "image-without-codecs",
    "crisp",
    "web-colors",
    "linux-theme-detection",
    "wayland",
    "x11",
] }
bytes.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
