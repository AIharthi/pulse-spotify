<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A202B" />
      <stop offset="55%" stop-color="#101318" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#434E63" />
      <stop offset="50%" stop-color="#222834" />
      <stop offset="100%" stop-color="#323B4D" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#F2AE52" stop-opacity="0.34" />
      <stop offset="48%" stop-color="#E59A3E" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#101318" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="amberBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD08A" />
      <stop offset="45%" stop-color="#F2AE52" />
      <stop offset="100%" stop-color="#D98324" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="50%" stop-color="#13171F" />
      <stop offset="100%" stop-color="#0D1015" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Chassis -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Subtle Inner Studio Bevel -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#222834" stroke-width="2" />

  <!-- Warm Analog Amber Ambient Glow -->
  <circle cx="256" cy="256" r="208" fill="url(#amberGlow)" />

  <!-- Precision Vinyl / DAC Dial Disc -->
  <circle cx="256" cy="256" r="168" fill="url(#discGrad)" stroke="#2A3242" stroke-width="3" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="#202633" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1B212C" stroke-width="2" />

  <!-- Amber Precision Ring -->
  <circle cx="256" cy="256" r="102" fill="#0E1117" stroke="url(#amberBar)" stroke-width="7" />

  <!-- Dynamic 5-Bar Audio Pulse Waveform -->
  <rect x="176" y="232" width="22" height="48" rx="11" fill="url(#amberBar)" />
  <rect x="210" y="202" width="22" height="108" rx="11" fill="url(#amberBar)" />
  <rect x="245" y="176" width="22" height="160" rx="11" fill="url(#amberBar)" />
  <rect x="280" y="210" width="22" height="92" rx="11" fill="url(#amberBar)" />
  <rect x="314" y="236" width="22" height="40" rx="11" fill="url(#amberBar)" />

  <!-- Subtle Top Specular Arc -->
  <path d="M 118 118 A 195 195 0 0 1 394 118" fill="none" stroke="#EDF1F7" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round" />
</svg>
